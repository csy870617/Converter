<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "/etc/fonts/conf.d/fonts.dtd">
<!--
  문서 변환 엔진(LibreOffice)의 글꼴 대체표. LibreOffice에 들어 있던 원래 규칙에 한글·윈도 글꼴 규칙을 더했다.
  문서에 적힌 글꼴이 없을 때 쓸 글꼴만 정한다(accept): 진짜 글꼴이 있으면(내 컴퓨터 글꼴 사용 등) 그것을 쓴다.
  고딕·돋움·굴림 계열 → 나눔고딕, 바탕·명조·궁서 계열 → 나눔명조. 나눔 글꼴에 없는 한자는 Noto 한자 글꼴로.
  (이 파일이 없으면 한글 글꼴 이름을 몰라 영문·숫자가 명조로, 바탕체 한글이 고딕으로 나온다)
-->
<fontconfig>
  <!-- LibreOffice 원래 규칙 -->
  <match target="pattern">
    <test name="family"><string>Symbol</string></test>
    <edit name="family" mode="append" binding="same"><string>OpenSymbol</string></edit>
  </match>
  <alias binding="same"><family>Liberation Sans Narrow</family><default><family>Arial Narrow</family></default></alias>
  <alias binding="same"><family>Arial Narrow</family><accept><family>Liberation Sans Narrow</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>

  <!-- 한글 고딕 계열 -->
  <alias binding="same"><family>맑은 고딕</family><accept><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>Malgun Gothic</family><accept><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>Malgun Gothic Semilight</family><accept><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>굴림</family><accept><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>Gulim</family><accept><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>굴림체</family><accept><family>NanumGothicCoding</family><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
  <alias binding="same"><family>GulimChe</family><accept><family>NanumGothicCoding</family><family>NanumGothic</family><family>Noto Sans KR Hanja</family></accept></alias>
